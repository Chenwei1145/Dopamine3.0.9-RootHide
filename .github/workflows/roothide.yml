name: "*** roothide: build and upload tipa ***"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest (not macos-14): newer Xcode/SDK provides sys/fileport.h,
    # which DarkSword/ClearSword (iOS 18.x exploits) include. macos-14 pins
    # Xcode 16.2 whose iOS 18.2 SDK lacks it -> build fails.
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Cache Homebrew bottles so `brew install` skips downloads on later runs.
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            homebrew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build deps (make, libarchive, ccache)
        run: |
          set -x
          brew install make libarchive ccache
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # THEOS + the pinned iOS 16.5 SDK are fully cacheable (rarely change).
      - name: Cache THEOS + SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          restore-keys: |
            theos-

      - name: Install THEOS (roothide fork)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      # trustcache is a stable tool; cache the built binary (pinned commit).
      - name: Cache trustcache binary
        id: cache-trustcache
        uses: actions/cache@v4
        with:
          path: trustcache-cache
          key: trustcache-aa0e8847529cf76576fce8d2dbc9e088c8f1a0df

      - name: Build and install trustcache
        if: steps.cache-trustcache.outputs.cache-hit != 'true'
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          git checkout aa0e8847529cf76576fce8d2dbc9e088c8f1a0df
          export CFLAGS="$CFLAGS -Wno-deprecated-declarations -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          cd ..
          mkdir -p trustcache-cache
          cp trustcache/trustcache trustcache-cache/trustcache
          sudo cp trustcache/trustcache /opt/procursus/bin/

      - name: Install trustcache (from cache)
        if: steps.cache-trustcache.outputs.cache-hit == 'true'
        run: |
          sudo cp trustcache-cache/trustcache /opt/procursus/bin/

      # ccache: transparently caches compiled objects across runs, so a small
      # source change no longer recompiles the whole BaseBin tree.
      - name: Cache ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          set -x
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,modules"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
          # Sanity check: the wrapped iOS compiler must resolve before the build.
          ccache xcrun -sdk iphoneos clang --version

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Verify Bootstraps (committed roothide layout)
        run: |
          set -x
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Download RootHide Manager
        run: |
          set -x
          curl -fsSL https://roothide.github.io/debfiles/com.roothide.manager_1.3.9_iphoneos-arm64e.deb -o Application/Dopamine/Resources/roothideapp.deb
          echo "b8f075e1844709845962900b22fe71136a66369a2c35bb1201087f2fd9476b7d  Application/Dopamine/Resources/roothideapp.deb" | shasum -a 256 -c -
          ls -la Application/Dopamine/Resources/roothideapp.deb

      - name: Build
        env:
          # THEOS reads TARGET_CC/TARGET_CXX via `?=` (env takes precedence),
          # so wrapping them in ccache is a transparent, non-breaking speedup.
          TARGET_CC: ccache xcrun -sdk iphoneos clang
          TARGET_CXX: ccache xcrun -sdk iphoneos clang++
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          typeset itemcount=$(plutil -extract items raw -expect array ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do if [ "$(plutil -extract items.$i.headerCellClass raw ./Application/Dopamine/UI/Settings/Credits.plist)" = "DOCreditsCell" ]; then DOCreditsCellIndex=$i; break; fi; done;
          plutil -insert items.$DOCreditsCellIndex.names -xml "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" -append ./Application/Dopamine/UI/Settings/Credits.plist
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
          VERSION=$(cat ./BaseBin/_external/basebin/.version)-$(git rev-parse --short HEAD)
          mv ./Application/Dopamine.tipa  "./Application/roothide-Dopamine-${VERSION}.tipa"
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: roothide-Dopamine-${{ env.version }}.tipa
          path: |
            ${{ github.workspace }}/Application/roothide-Dopamine-${{ env.version }}.tipa
